# Projeto Presença — Marco 4
#
#   docker compose up -d banco            # só o banco (o servidor roda no Windows)
#   docker compose --profile tudo up -d   # banco + servidor em contêiner
#
# A âncora (ancora.py) NÃO entra em contêiner: ela usa o Bluetooth do Windows.
# O broker é o EMQX Cloud (TLS + senha); as credenciais vêm de segredos.json.

services:
  banco:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: presenca-banco
    environment:
      POSTGRES_USER: presenca
      POSTGRES_PASSWORD: presenca        # só local (porta presa ao 127.0.0.1)
      POSTGRES_DB: presenca
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - dados-presenca:/var/lib/postgresql/data
      - ./banco/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presenca -d presenca"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  servidor:
    profiles: ["tudo"]
    build: ./servidor
    container_name: presenca-servidor
    depends_on:
      banco:
        condition: service_healthy
    environment:
      PRESENCA_DSN: postgresql://presenca:presenca@banco:5432/presenca
      PRESENCA_API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./segredos.json:/app/segredos.json:ro
      - ./servidor/chave-servidor.pem:/app/servidor/chave-servidor.pem:ro
      - ./contrato:/app/contrato:ro
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  dados-presenca:
